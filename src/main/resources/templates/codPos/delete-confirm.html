<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos/general.html :: headfiles}">
    <title th:text="${titulo} ?: 'Confirmar Borrado'"></title>
</head>

<body>
    <header th:replace="~{fragmentos/general.html :: navegacion}"></header>

    <main class="page">
        <div th:if="${codPos}" class="card card--lg confirm">
            <div class="confirm-head" th:text="${titulo} ?: 'Confirmación de Eliminación'">Confirmación de Eliminación</div>
            <div class="confirm-body">
                <h1>¿Borrar código postal?</h1>
                <div class="confirm-target">
                    <strong><span th:text="${codPos.cp}">14001</span> · <span th:text="${codPos.municipio}">Ciudad Ejemplo</span></strong>
                </div>
                <div class="alert alert--warn">¡ADVERTENCIA! Está a punto de borrar el siguiente Código Postal. Esta acción es irreversible.</div>
            </div>
            <div class="confirm-actions">
                <a th:href="@{/admin/codPos/}" class="btn">NO, Cancelar y Volver</a>
                <form th:action="@{/admin/codPos/del/{cp}(cp=${codPos.cp})}" method="post">
                    <button type="submit" class="btn btn--danger">SÍ, Borrar Definitivamente</button>
                </form>
            </div>
        </div>

        <div th:unless="${codPos}" class="empty">
            <strong>No encontrado</strong>
            <span>No se encontró el Código Postal para confirmar la eliminación.</span>
            <a th:href="@{/admin/codPos/}" class="btn btn--primary">Volver al listado</a>
        </div>
    </main>

    <footer th:replace="~{fragmentos/general.html :: footer}"></footer>
</body>
</html>
