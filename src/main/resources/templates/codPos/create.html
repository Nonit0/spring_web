<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos/general.html :: headfiles}">
</head>

<body>
    <header th:replace="~{fragmentos/general.html :: navegacion}"></header>

    <main class="page page--xs">
        <div class="page-head-text">
            <a th:href="@{/admin/codPos/}" class="back-link">← Códigos Postales</a>
            <h1 class="title" th:switch="${accion}">
                <span th:case="añadir">Añadir un Código Postal</span>
                <span th:case="editar">Editando el Código Postal</span>
            </h1>
        </div>

        <form class="card card--lg card--pad" method="post" th:object="${codPos}"
              th:action="${accion == 'añadir'}
                    ? @{/admin/codPos/add}
                    : @{/admin/codPos/edit/{cp}(cp=*{cp})}">

            <div class="form-grid form-grid--1-2">
                <label class="field" for="cp">
                    <span class="field-label">Código Postal</span>
                    <input type="number" th:field="*{cp}" class="input input--mono"
                           placeholder="ej: 14001" th:readonly="${accion == 'editar'}" />
                </label>
                <label class="field" for="municipio">
                    <span class="field-label">Municipio</span>
                    <input type="text" th:field="*{municipio}" class="input" placeholder="ej: Jaén" required />
                </label>
            </div>

            <label class="field" for="provinciaId">
                <span class="field-label">Provincia</span>
                <select th:field="*{provinciaId}" class="select" required>
                    <option value="">-- Seleccione una provincia --</option>
                    <option th:each="provincia : ${provinciasList}"
                            th:value="${provincia.codigo}"
                            th:text="${provincia.nombre}">Provincia Ejemplo</option>
                </select>
            </label>

            <div class="form-actions">
                <button type="submit" class="btn btn--ok">Guardar Código Postal</button>
                <a th:href="@{/admin/codPos/}" class="btn">Cancelar y Volver</a>
            </div>
        </form>
    </main>

    <footer th:replace="~{fragmentos/general.html :: footer}"></footer>
</body>
</html>
