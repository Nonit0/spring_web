<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/general.html :: headfiles}">
    <title>Confirmar Borrado</title>
</head>
<body>
    <header th:replace="~{fragmentos/general.html :: navegacion}"></header>

    <main class="page">
        <div class="card card--lg confirm">
            <div class="confirm-head">Confirmar Eliminación de Dirección</div>
            <div class="confirm-body">
                <h1>¿Borrar dirección?</h1>
                <span class="kicker">Usuario: <span th:text="${usuario.username}"></span></span>
                <div class="confirm-target">
                    <strong>
                        <span th:text="${direccion.tipoVia}"></span>
                        <span th:text="${direccion.nombreVia}"></span>,
                        <span th:text="${direccion.numero}"></span>
                    </strong>
                    <span class="mono">
                        ID <span th:text="${direccion.id}"></span> · CP <span th:text="${direccion.codPosCP}"></span>
                    </span>
                </div>
                <div class="alert alert--warn">¿Está seguro de que desea eliminar la siguiente dirección? Esta acción es irreversible.</div>
            </div>
            <div class="confirm-actions">
                <a th:href="@{/admin/usuario/{idUsuario}/direccion(idUsuario=${usuario.id})}" class="btn">Cancelar</a>
                <form th:action="@{/admin/usuario/{idUsuario}/direccion/del/{idDireccion}(idUsuario=${usuario.id}, idDireccion=${direccion.id})}" method="post">
                    <button type="submit" class="btn btn--danger">Sí, Eliminar Dirección</button>
                </form>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragmentos/general.html :: footer}"></footer>
</body>
</html>
