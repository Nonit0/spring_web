<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/general.html :: headfiles}">
    <title>Direcciones del Usuario</title>
</head>
<body>
    <header th:replace="~{fragmentos/general.html :: navegacion}"></header>

    <main class="page">
        <div class="page-head">
            <div class="page-head-text">
                <a th:href="@{/admin/usuario/}" class="back-link">← Volver al Listado de Usuarios</a>
                <h1 class="title">Direcciones de: <span class="title-mark" th:text="${usuario.username}">NombreUsuario</span></h1>
            </div>
            <a th:href="@{/admin/usuario/{idUsuario}/direccion/add(idUsuario=${usuario.id})}" class="btn btn--ok">+ Añadir Nueva Dirección</a>
        </div>

        <div th:if="${mensaje}" class="alert alert--ok" th:text="${mensaje}"></div>
        <div th:if="${error}" class="alert alert--error" th:text="${error}"></div>

        <div class="dir-grid" th:unless="${direccionesList.isEmpty()}">
            <article class="card dir-card" th:each="dir : ${direccionesList}">
                <div class="dir-card-head">
                    <span th:text="${dir.tipoVia}">CALLE</span>
                    <span th:text="|#${dir.id}|">#1</span>
                </div>
                <div class="dir-card-body">
                    <strong><span th:text="${dir.nombreVia}">Gran Vía</span>, <span th:text="${dir.numero}">10</span></strong>
                    <span class="mono" th:text="${dir.codPosCP}">28001 - Madrid</span>
                </div>
                <div class="dir-card-actions">
                    <a th:href="@{/admin/usuario/{idUsuario}/direccion/edit/{idDireccion}(idUsuario=${usuario.id}, idDireccion=${dir.id})}">Editar</a>
                    <a class="is-danger" th:href="@{/admin/usuario/{idUsuario}/direccion/del/{idDireccion}(idUsuario=${usuario.id}, idDireccion=${dir.id})}">Borrar</a>
                </div>
            </article>
        </div>

        <div th:if="${direccionesList.isEmpty()}" class="empty">
            <strong>Sin direcciones</strong>
            <span>Este usuario no tiene direcciones registradas.</span>
        </div>
    </main>

    <footer th:replace="~{fragmentos/general.html :: footer}"></footer>
</body>
</html>
