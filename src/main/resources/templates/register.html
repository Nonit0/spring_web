<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos/general.html :: headfiles}">
    <title>Registro de Usuario</title>
</head>

<body>
    <header th:replace="~{fragmentos/general.html :: navegacion}"></header>

    <main class="page page--narrow">
        <div class="page-head-text">
            <span class="kicker kicker--lima">Nueva cuenta</span>
            <h1 class="title">Registro de Nuevo Usuario</h1>
        </div>

        <div th:if="${mensaje}" class="alert alert--ok" th:text="${mensaje}">Mensaje de éxito del servidor.</div>
        <div th:if="${error}" class="alert alert--error" th:text="${error}">Mensaje de error del servidor.</div>

        <form method="post" th:action="@{/register}" class="card card--lg card--pad">
            <div class="form-grid">
                <label class="field" for="username">
                    <span class="field-label">Username</span>
                    <input type="text" id="username" name="username" class="input" required>
                </label>

                <label class="field" for="password">
                    <span class="field-label">Contraseña</span>
                    <input type="password" id="password" name="password" class="input" required>
                    <span class="field-help">ContraseñaSeguraConfiaEnMi</span>
                </label>

                <label class="field" for="email">
                    <span class="field-label">Email</span>
                    <input type="email" id="email" name="email" class="input" required>
                    <span class="field-help">ejemplo@ejemplodom.com</span>
                </label>

                <label class="field" for="telefono">
                    <span class="field-label">Teléfono</span>
                    <input type="number" id="telefono" name="telefono" class="input input--mono" required
                           min="100000000" max="999999999" step="1">
                    <span class="field-help">Solo números, máx 9/10 dígitos</span>
                </label>

                <label class="field" for="nif">
                    <span class="field-label">NIF/DNI</span>
                    <input type="text" id="nif" name="nif" class="input input--mono" required
                           minlength="9" maxlength="9"
                           pattern="[0-9]{8}[A-Za-z]{1}"
                           title="El NIF debe tener 8 dígitos seguidos de 1 letra (ej. 12345678A).">
                    <span class="field-help">Formato requerido: 8 dígitos y 1 letra.</span>
                </label>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn--primary">Registrarse</button>
                <a href="/login" class="back-link">Ya tengo cuenta</a>
            </div>
        </form>
    </main>

    <footer th:replace="~{fragmentos/general.html :: footer}"></footer>
</body>
</html>
