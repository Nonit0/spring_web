<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Registro de Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <main class="container my-5">
        <h1>Registro de Nuevo Usuario</h1>
        
        <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}">Mensaje de éxito del servidor.</div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}">Mensaje de error del servidor.</div>

        <form method="post" action="/register" class="row g-3">
            
            <div class="col-md-6">
                <label for="username" class="form-label">Username:</label>
                <input type="text" id="username" name="username" class="form-control" required>
            </div>
            
            <div class="col-md-6">
                <label for="password" class="form-label">Contraseña:</label>
                <input type="password" id="password" name="password" class="form-control" required>
                <div class="form-text">ContraseñaSeguraConfiaEnMi</div>
            </div>
            
            <div class="col-md-6">
                <label for="email" class="form-label">Email:</label>
                <input type="email" id="email" name="email" class="form-control" required>
                <div class="form-text">ejemplo@ejemplodom.com</div>
            </div>
            
            <div class="col-md-6">
                <label for="telefono" class="form-label">Teléfono (Solo números, máx 9/10 dígitos):</label>
                <input type="number" id="telefono" name="telefono" class="form-control" required
                       min="100000000"           max="999999999"           step="1">
            </div>
            
            <div class="col-md-6">
                <label for="nif" class="form-label">NIF/DNI:</label>
                <input type="text" 
                    id="nif" 
                    name="nif" 
                    class="form-control" 
                    required 
                    minlength="9" 
                    maxlength="9"
                    pattern="[0-9]{8}[A-Za-z]{1}" 
                    title="El NIF debe tener 8 dígitos seguidos de 1 letra (ej. 12345678A).">
                
                <div class="form-text">Formato requerido: 8 dígitos y 1 letra.</div>
            </div>

            <div class="col-12 mt-4">
                <button type="submit" class="btn btn-primary">Registrarse</button>
            </div>
        </form>
    </main>
</body>
</html>
