<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="headfiles">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" th:href="@{/css/tienda.css}" href="/css/tienda.css">
  <title th:text="${titulo} ?: 'Tienda Virtual de Camisetas'">Tienda Virtual de Camisetas</title>
</head>

<body>
  <div>
    <header th:fragment="navegacion" class="site-header">
      <div class="header-inner">
        <a class="brand" href="/">
          <span class="brand-mark">TVC</span>
          <span class="brand-text"><strong>Tienda Virtual</strong><span>de Camisetas</span></span>
        </a>
        <ul class="nav">
          <li><a class="nav-link" href="/">Inicio</a></li>
          <li>
            <details class="nav-dd">
              <summary class="nav-link">Provincias</summary>
              <ul class="nav-dd-menu">
                <li><a href="/admin/provincia">Listado provincias</a></li>
                <li><a href="/admin/provincia/add">Alta provincia</a></li>
              </ul>
            </details>
          </li>
          <li>
            <details class="nav-dd">
              <summary class="nav-link">Códigos Postales</summary>
              <ul class="nav-dd-menu">
                <li><a href="/admin/codPos">Listado Códigos Postales</a></li>
                <li><a href="/admin/codPos/add">Alta Códigos Postales</a></li>
              </ul>
            </details>
          </li>
          <li><a class="nav-link" href="/admin/usuario">Usuarios</a></li>
          <li class="nav-sep" aria-hidden="true"></li>
          <li sec:authorize="isAuthenticated()"><a class="btn btn--nav btn--danger" href="/logout">Logout</a></li>
          <li sec:authorize="isAnonymous()"><a class="btn btn--nav" href="/login">Login</a></li>
          <li sec:authorize="isAnonymous()"><a class="btn btn--nav btn--primary" href="/register">Register</a></li>
        </ul>
      </div>
    </header>

    <footer th:fragment="footer" class="site-footer">
      <div class="footer-inner">
        <span>© 2026 Tienda Virtual de Camisetas</span>
        <span>Spring Boot · Thymeleaf · JPA</span>
      </div>
      <script>
        document.addEventListener('click', function (e) {
          document.querySelectorAll('.nav-dd[open]').forEach(function (d) {
            if (!d.contains(e.target)) d.removeAttribute('open');
          });
        });
      </script>
    </footer>
  </div>
</body>

</html>
