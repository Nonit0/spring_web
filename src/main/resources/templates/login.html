<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos/general.html :: headfiles}">
</head>

<body>
    <header th:replace="~{fragmentos/general.html :: navegacion}"></header>

    <main class="page">
        <section class="split">
            <div class="stack">
                <span class="kicker">Acceso</span>
                <h1 class="title title--xl">Hola de nuevo.</h1>
                <p class="lead">Inicia sesión en la Tienda Virtual de Camisetas.</p>
            </div>

            <form method="post" action="/login" class="card card--lg card--pad">
                <div th:if="${param.error}" class="alert alert--error">Usuario o contraseña incorrectos.</div>
                <div th:if="${param.logout}" class="alert alert--ok">Has cerrado sesión.</div>
                <div th:if="${mensaje}" class="alert alert--ok" th:text="${mensaje}"></div>

                <label class="field" for="username">
                    <span class="field-label">Usuario</span>
                    <input name="username" class="input" id="username" type="text" autocomplete="username" required>
                </label>
                <label class="field" for="password">
                    <span class="field-label">Password</span>
                    <input name="password" class="input" id="password" type="password" autocomplete="current-password" required>
                </label>

                <button class="btn btn--primary btn--block" type="submit">Enviar</button>

                <div class="divider">o</div>
                <div class="row-actions" style="justify-content:space-between">
                    <span style="font-weight:600">¿Aún no tienes cuenta?</span>
                    <a href="/register" class="btn btn--nav">Regístrate Aquí →</a>
                </div>
            </form>
        </section>
    </main>

    <footer th:replace="~{fragmentos/general.html :: footer}"></footer>
</body>
</html>
