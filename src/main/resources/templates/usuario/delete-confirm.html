<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/general.html :: headfiles}">
    <title>Confirmar Borrado de Usuario</title>
</head>
<body>
    <header th:replace="~{fragmentos/general.html :: navegacion}"></header>

    <main class="page">
        <div th:if="${usuario}" class="card card--lg confirm">
            <div class="confirm-head">Confirmación de Eliminación</div>
            <div class="confirm-body">
                <h1>¿Borrar usuario?</h1>
                <div class="table-wrap" style="box-shadow:none">
                    <table class="table table--kv">
                        <tbody>
                            <tr><td>ID</td><td class="t-mono" th:text="${usuario.id}"></td></tr>
                            <tr><td>Username</td><td class="t-strong" th:text="${usuario.username}"></td></tr>
                            <tr><td>Email</td><td th:text="${usuario.email}"></td></tr>
                            <tr><td>Rol</td><td><span class="badge" th:text="${usuario.rol}"></span></td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="alert alert--warn">
                    <span>¡ADVERTENCIA! Va a borrar al usuario <strong th:text="${usuario.username}"></strong>. Esta acción es irreversible.</span>
                </div>
            </div>
            <div class="confirm-actions">
                <a th:href="@{/admin/usuario/}" class="btn">NO, Cancelar y Volver</a>
                <form th:action="@{/admin/usuario/del/{id}(id=${usuario.id})}" method="post">
                    <button type="submit" class="btn btn--danger">SÍ, Borrar Definitivamente</button>
                </form>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragmentos/general.html :: footer}"></footer>
</body>
</html>
