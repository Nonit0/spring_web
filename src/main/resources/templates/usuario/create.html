<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/general.html :: headfiles}">
    <title th:text="${accion == 'añadir'} ? 'Añadir Usuario' : 'Editar Usuario'"></title>
</head>
<body>
    <div th:replace="~{fragmentos/general.html :: navegacion}"></div>
    
    <main class="container my-5">
        <h1 th:text="${accion == 'añadir'} ? 'Añadir Nuevo Usuario' : 'Editar Usuario'"></h1>
        
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>

        <form th:action="${accion == 'añadir'} ? @{/admin/usuario/add} : @{/admin/usuario/edit/{id}(id=${usuario.id})}" 
              th:object="${usuario}" 
              method="post" 
              class="row g-3">
            
            <input th:if="${accion == 'editar'}" type="hidden" th:field="*{id}" />

            <div class="col-md-6">
                <label for="username" class="form-label">Username:</label>
                <input type="text" id="username" class="form-control" th:field="*{username}" required>
            </div>
            
            <div class="col-md-6">
                <label for="rawPassword" class="form-label">Contraseña:</label>
                <input type="password" id="rawPassword" name="rawPassword" class="form-control" 
                       th:required="${accion == 'añadir'}" 
                       placeholder="Escribir solo si quieres cambiar/establecer"/>
                
                <div class="form-text" 
                     th:text="${accion == 'añadir'} ? 'La contraseña es obligatoria al crear.' : 'Dejar vacío para mantener la contraseña actual.'">
                </div>
            </div>
            
            <div class="col-md-6">
                <label for="email" class="form-label">Email:</label>
                <input type="email" id="email" class="form-control" th:field="*{email}" required>
            </div>
            
            <div class="col-md-6">
                <label for="telefono" class="form-label">Teléfono:</label>
                <input type="number" id="telefono" class="form-control" th:field="*{telefono}" required>
            </div>
            
            <div class="col-md-6">
                <label for="nif" class="form-label">NIF/DNI:</label>
                <input type="text" id="nif" class="form-control" th:field="*{nif}" required>
            </div>
            
            <div class="col-md-6">
                <label for="rol" class="form-label">Rol:</label>
                <select id="rol" class="form-select" th:field="*{rol}" required>
                    <option th:each="rol : ${T(com.iesvdc.dam.demo2.modelos.Rol).values()}" 
                            th:value="${rol}" 
                            th:text="${rol.name()}">CLIENTE</option>
                </select>
            </div>

            <div class="col-md-6">
                <label for="enabled" class="form-label">Habilitado:</label>
                <select id="enabled" class="form-select" th:field="*{enabled}" required>
                    <option th:value="true">Sí</option>
                    <option th:value="false">No</option>
                </select>
            </div>

            <div class="col-12 mt-4">
                <button type="submit" th:text="${accion == 'añadir'} ? 'Añadir Usuario' : 'Guardar Cambios'" class="btn btn-success"></button>
                <a th:href="@{/admin/usuario/}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </main>
    <div th:replace="~{fragmentos/general.html :: footer}"></div>
</body>
</html>
