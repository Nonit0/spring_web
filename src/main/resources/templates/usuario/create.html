<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/general.html :: headfiles}">
    <title th:text="${accion == 'añadir'} ? 'Añadir Usuario' : 'Editar Usuario'"></title>
</head>
<body>
    <header th:replace="~{fragmentos/general.html :: navegacion}"></header>

    <main class="page page--narrow">
        <div class="page-head-text">
            <a th:href="@{/admin/usuario/}" class="back-link">← Usuarios</a>
            <h1 class="title" th:text="${accion == 'añadir'} ? 'Añadir Nuevo Usuario' : 'Editar Usuario'"></h1>
        </div>

        <div th:if="${error}" class="alert alert--error" th:text="${error}"></div>
        <div th:if="${mensaje}" class="alert alert--ok" th:text="${mensaje}"></div>

        <form th:action="${accion == 'añadir'} ? @{/admin/usuario/add} : @{/admin/usuario/edit/{id}(id=${usuario.id})}"
              th:object="${usuario}"
              method="post"
              class="card card--lg card--pad">

            <input th:if="${accion == 'editar'}" type="hidden" th:field="*{id}" />

            <div class="form-grid">
                <label class="field" for="username">
                    <span class="field-label">Username</span>
                    <input type="text" id="username" class="input" th:field="*{username}" required>
                </label>

                <label class="field" for="rawPassword">
                    <span class="field-label">Contraseña</span>
                    <input type="password" id="rawPassword" name="rawPassword" class="input"
                           th:required="${accion == 'añadir'}"
                           placeholder="Escribir solo si quieres cambiar/establecer"/>
                    <span class="field-help"
                          th:text="${accion == 'añadir'} ? 'La contraseña es obligatoria al crear.' : 'Dejar vacío para mantener la contraseña actual.'"></span>
                </label>

                <label class="field" for="email">
                    <span class="field-label">Email</span>
                    <input type="email" id="email" class="input" th:field="*{email}" required>
                </label>

                <label class="field" for="telefono">
                    <span class="field-label">Teléfono</span>
                    <input type="number" id="telefono" class="input input--mono" th:field="*{telefono}" required>
                </label>

                <label class="field" for="nif">
                    <span class="field-label">NIF/DNI</span>
                    <input type="text" id="nif" class="input input--mono" th:field="*{nif}" required>
                </label>

                <label class="field" for="rol">
                    <span class="field-label">Rol</span>
                    <select id="rol" class="select" th:field="*{rol}" required>
                        <option th:each="rol : ${T(com.iesvdc.dam.demo2.modelos.Rol).values()}"
                                th:value="${rol}"
                                th:text="${rol.name()}">CLIENTE</option>
                    </select>
                </label>

                <label class="field" for="enabled">
                    <span class="field-label">Habilitado</span>
                    <select id="enabled" class="select" th:field="*{enabled}" required>
                        <option th:value="true">Sí</option>
                        <option th:value="false">No</option>
                    </select>
                </label>
            </div>

            <div class="form-actions">
                <button type="submit" th:text="${accion == 'añadir'} ? 'Añadir Usuario' : 'Guardar Cambios'" class="btn btn--ok"></button>
                <a th:href="@{/admin/usuario/}" class="btn">Cancelar</a>
            </div>
        </form>
    </main>

    <footer th:replace="~{fragmentos/general.html :: footer}"></footer>
</body>
</html>
