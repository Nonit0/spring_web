spring.application.name=neocamisetas

# Lee las credenciales del .env local, que no se versiona (ver .env.example).
spring.config.import=optional:file:src/main/resources/stack-spring-camiseta/.env[.properties]

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_HOST_PORT:33308}/${MYSQL_DATABASE:tshirt}?useUnicode=yes&characterEncoding=UTF-8&createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_ROOT_PASSWORD:}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# La base se recrea en cada arranque con los datos de import.sql.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=true
